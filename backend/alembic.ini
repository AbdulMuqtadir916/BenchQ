# Alembic configuration. Run from the repo root (or /app in the container):
#   alembic -c backend/alembic.ini upgrade head
# The database URL is never set here; migrations/env.py reads backend.config.DATABASE_URL.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = ..
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
