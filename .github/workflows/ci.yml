# Checks every PR into main (named codex/json-data-migration until 2026-10-22; handoff step 3, after F1/0002).
# No push trigger and no pip-audit, by decision. The commands are the same ones a contributor runs locally (CLAUDE.md "Commands",
# docs/integration/README.md "Tests run on Postgres").
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
      extension: ${{ steps.paths.outputs.extension }}
      backend: ${{ steps.paths.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: paths
        shell: bash
        run: |
          frontend=false
          extension=false
          backend=false

          # The first parent of the PR merge commit is the base that this CI run tests against.
          # Disable rename detection so both the old and new paths are considered.
          git rev-parse --verify HEAD^2 > /dev/null
          git diff --name-only --no-renames -z HEAD^1 HEAD > "$RUNNER_TEMP/benchq-changed-paths"
          while IFS= read -r -d '' path; do
            case "$path" in
              backend/auth/policy_table.json|src/mocks/data/*|src/lib/api/dto/demo-ids.json)
                frontend=true
                backend=true
                ;;
              backend/*|pytest.ini|Dockerfile.backend|docker-compose.yml|.dockerignore)
                backend=true
                ;;
              extension/*|.nvmrc)
                # Root ESLint and TypeScript also cover extension sources.
                frontend=true
                extension=true
                ;;
              src/*|public/*|scripts/qa/candidate-gmail/*|.env.example|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|next.config.ts|tsconfig.json|vitest.config.ts|eslint.config.mjs|postcss.config.mjs|components.json)
                frontend=true
                ;;
              docs/*|README.md|CONTRIBUTING.md|AGENTS.md|CLAUDE.md|product.md|design.md|design-qa.md|.github/pull_request_template.md)
                ;;
              *)
                # Workflow changes and any unrecognized inputs run every suite.
                frontend=true
                extension=true
                backend=true
                break
                ;;
            esac
          done < "$RUNNER_TEMP/benchq-changed-paths"
          printf 'frontend=%s\nextension=%s\nbackend=%s\n' "$frontend" "$extension" "$backend" >> "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    # Run the suite if change detection failed, including while the existing checks are still required.
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # The Chrome extension has its own package and tests (vitest, jsdom); its build runs tsc -b first.
  extension:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.extension != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci --prefix extension
      - run: npm --prefix extension run test
      - run: npm --prefix extension run build
      # The store's own build: https only, no local address, no all-sites access. Fails here instead of in review.
      - run: npm --prefix extension run build:store

  backend:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # Mirrors docker-compose's db-test service: same image, user and database, on port 5433.
      db-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobnavigator
          POSTGRES_PASSWORD: password
          POSTGRES_DB: jobnavigator_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jobnavigator -d jobnavigator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://jobnavigator:password@localhost:5433/jobnavigator_test
    steps:
      - uses: actions/checkout@v4
      # The backend image runs Python 3.12 (Dockerfile.backend).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # "live" tests hit a running stack over HTTP; there is none here.
      - run: python -m pytest backend/tests -q -o asyncio_mode=auto -m "not live" -p no:cacheprovider

  # Secret scan of the PR's own commits with the pinned gitleaks release (not the Marketplace action), rules and
  # allowlists in the base branch's .gitleaks.toml. Runs on every PR, whatever the paths. To bump: change
  # GITLEAKS_VERSION and GITLEAKS_SHA256 together, the hash taken from that release's gitleaks_<version>_checksums.txt
  # (linux_x64 line).
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the base branch and every commit of the PR are present.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        shell: bash
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      - name: Scan the PR's commits
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The policy comes from the BASE branch, never from the PR's checkout, so a PR cannot weaken the scan of its
        # own commits (disable a rule, allowlist its own secret). A PR that changes .gitleaks.toml is scanned with
        # main's policy; its new allowlist only takes effect after it merges. When the base has no .gitleaks.toml
        # (before the first one merges) the scan uses gitleaks' built-in rules alone. --config is passed in both
        # cases: without it gitleaks would load ./.gitleaks.toml, the PR's copy. For the same reason the PR's
        # .gitleaksignore is deleted from the working copy (the scan reads commits, not files on disk) and inline
        # "gitleaks:allow" comments are ignored. Exits non-zero on any finding; --redact keeps secret values out of
        # the log.
        run: |
          config="$RUNNER_TEMP/gitleaks.toml"
          if git cat-file -e "${BASE_SHA}:.gitleaks.toml" 2>/dev/null; then
            git show "${BASE_SHA}:.gitleaks.toml" > "$config"
            echo "Policy: .gitleaks.toml from the base branch (${BASE_SHA})."
          else
            printf '[extend]\nuseDefault = true\n' > "$config"
            echo "::notice::The base branch (${BASE_SHA}) has no .gitleaks.toml: scanning with gitleaks' built-in rules only, no allowlists."
          fi
          rm -f .gitleaksignore
          "$RUNNER_TEMP/gitleaks/gitleaks" git --config "$config" --ignore-gitleaks-allow --redact --no-banner \
            --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" .

  required:
    name: CI required
    needs: [changes, frontend, extension, backend, gitleaks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check CI results
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          FRONTEND: ${{ needs.frontend.result }}
          EXTENSION: ${{ needs.extension.result }}
          BACKEND: ${{ needs.backend.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          EXPECTED_FRONTEND: ${{ needs.changes.outputs.frontend == 'false' && 'skipped' || 'success' }}
          EXPECTED_EXTENSION: ${{ needs.changes.outputs.extension == 'false' && 'skipped' || 'success' }}
          EXPECTED_BACKEND: ${{ needs.changes.outputs.backend == 'false' && 'skipped' || 'success' }}
        run: |
          check() {
            if [[ "$2" != "$3" ]]; then
              printf '::error::%s finished with %s, expected %s\n' "$1" "$2" "$3"
              return 1
            fi
          }
          check changes "$CHANGES" success
          check frontend "$FRONTEND" "$EXPECTED_FRONTEND"
          check extension "$EXTENSION" "$EXPECTED_EXTENSION"
          check backend "$BACKEND" "$EXPECTED_BACKEND"
          # Never path-gated, so anything but success (a skip included) fails.
          check gitleaks "$GITLEAKS" success
