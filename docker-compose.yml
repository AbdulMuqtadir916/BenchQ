services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      POSTGRES_USER: jobnavigator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: jobnavigator
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobnavigator"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Throwaway Postgres for the backend tests: data lives in memory and is gone on stop. The tests
  # refuse to run against any database whose name does not end in _test. Off by default; naming it
  # starts it: docker compose up -d db-test
  db-test:
    image: postgres:16-alpine
    profiles: ["test"]
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_USER: jobnavigator
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jobnavigator_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobnavigator -d jobnavigator_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # Built from this repo's backend/ (a copy of JobNavigator — see backend/UPSTREAM.md).
    image: benchq-backend:local
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # Backend secrets live in backend/.env (copy backend/.env.example), never in the root
    # .env* files that Next.js loads. Optional: the backend starts without it.
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://jobnavigator:${POSTGRES_PASSWORD:-password}@db:5432/jobnavigator
      # Local development: session cookies work over plain http://localhost and the API docs are on.
      # Leave it unset in production (the default is production).
      BENCHQ_ENV: development
      # Used only by pytest (backend/tests/conftest.py); the app never reads it.
      TEST_DATABASE_URL: postgresql://jobnavigator:password@db-test:5432/jobnavigator_test
    ports:
      - "127.0.0.1:8000:8000"   # the Next.js app proxies /api/* here (BACKEND_URL)
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./backups:/app/backups
      - ./backend/.linkedin_api:/root/.linkedin_api
      - codex_auth:/root/.codex
      # agy keeps its OAuth token in a file here; no keyring in this image.
      - antigravity_auth:/root/.gemini

  # Database viewer, off by default: docker compose --profile tools up -d adminer
  # then open http://localhost:8081 (server db, user/db jobnavigator, password "password").
  adminer:
    image: adminer:latest
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  codex_auth:
  antigravity_auth:
